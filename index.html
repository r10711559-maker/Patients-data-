<!DOCTYPE html>
<html>

<head>
  <title>Patients Data</title>
</head>

<body>

<h1>Patients List</h1>

<div id="output">Loading...</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://iktsnuettyijuqziplsr.supabase.co"

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrdHNudWV0dHlpanVxemlwbHNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODcxMDcsImV4cCI6MjA5NTQ2MzEwN30.hYmHXouqrX35k-3XTbbYUWmuubKjz-BeaJt0lcdo9v0"

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
)

async function loadPatients() {

  const result = await client
    .from("patients")
    .select("*")

  if(result.error){
    document.getElementById("output").innerHTML =
      result.error.message
    return
  }

  let html = `
  <table border="1" cellpadding="10">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Age</th>
      <th>Gender</th>
      <th>Mobile</th>
      <th>Test</th>
      <th>Address</th>
    </tr>
  `

  result.data.forEach(p => {

    html += `
    <tr>
      <td>${p.id}</td>
      <td>${p.name}</td>
      <td>${p.age}</td>
      <td>${p.gender}</td>
      <td>${p.mobile}</td>
      <td>${p.test}</td>
      <td>${p.address}</td>
    </tr>
    `
  })

  html += `</table>`

  document.getElementById("output").innerHTML = html
}

loadPatients()

</script>

</body>
</html>
